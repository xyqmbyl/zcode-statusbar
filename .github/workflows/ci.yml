name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (daemon)
        run: node --check zcode-statusbar.mjs
      - name: Syntax check (overlay)
        run: node --check overlay.js
